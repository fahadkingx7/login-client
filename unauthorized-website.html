<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Not Authorized</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#4f46e5;--line:#e4e7ec}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(145deg,#fff,#f5f7fb);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:28px}
.box{width:min(720px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:58px 52px 50px;box-shadow:0 26px 80px rgba(15,23,42,.12);text-align:center}
.icon{width:84px;height:84px;border-radius:24px;background:#f4f3ff;color:var(--accent);display:grid;place-items:center;margin:0 auto 22px;font-size:38px;font-weight:900;border:1px solid #d9d6ff}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#68758b}
h1{font-size:38px;line-height:1.1;margin:12px 0 12px;letter-spacing:-.035em}
p{margin:0;color:var(--muted);font-size:18px;line-height:1.6}
.notice{margin-top:28px;padding:21px 24px;background:#f8fafc;border:1px solid var(--line);border-radius:18px;color:#344054;font-size:15px;line-height:1.65;text-align:left}
.notice strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
a.btn{display:flex;align-items:center;justify-content:center;margin-top:28px;border-radius:18px;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;padding:23px 28px;font-weight:800;font-size:20px;text-decoration:none;width:100%;min-height:72px;box-shadow:0 18px 38px rgba(79,70,229,.2);transition:transform .15s ease,filter .15s ease}
a.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
a.btn:active{transform:translateY(0)}
@media(max-width:640px){body{padding:18px}.box{padding:42px 24px 34px;border-radius:22px}.icon{width:72px;height:72px;border-radius:20px;font-size:32px}h1{font-size:30px}p{font-size:16px}a.btn{font-size:18px;min-height:66px}}
</style>
<style id="veefivee-footer-visibility">.veefivee-footer{position:fixed!important;left:0!important;right:0!important;bottom:0!important;margin:0!important;padding:12px 20px 14px!important;z-index:99999!important;background:rgba(245,247,251,.97)!important;border-top:1px solid #e5e7ef!important;box-shadow:0 -6px 18px rgba(15,23,42,.05)!important;}</style></head>
<body>
<main class="box">
  <div class="icon">!</div>
  <div class="eyebrow">Website Access</div>
  <h1>Unauthorized Website</h1>
  <p>This website is not authorized for your shared account.</p>
  <div class="notice"><strong>Access not allowed</strong>Please continue through your connected DAT website.</div>
  <a class="btn" href="https://one.dat.com/">Go to one.dat.com</a>
</main>
<footer class="veefivee-footer" style="box-sizing:border-box;width:100%;margin:40px auto 0;padding:16px 20px 18px;text-align:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:500;line-height:1.5;color:#6d4aff;letter-spacing:.1px;">Developed by 🌴<a href="https://veefivee.com" target="_blank" rel="noopener noreferrer" style="color:#6d4aff;text-decoration:none;font-weight:700;">VeeFivee</a></footer>
</body>
</html>
