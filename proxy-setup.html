<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogIn • New DAT Setup</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#4f46e5;--accent2:#7c3aed;--line:#e5e7eb;--good:#067647;--goodbg:#ecfdf3}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff,#f5f7fb);color:var(--text);display:grid;place-items:center;padding:28px}
.box{width:min(580px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:42px 44px 36px;box-shadow:0 24px 70px rgba(15,23,42,.12);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}.brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900}.brand-name{font-size:19px;font-weight:900;letter-spacing:-.02em}
.icon{width:76px;height:76px;border-radius:24px;background:var(--goodbg);color:var(--good);display:grid;place-items:center;margin:0 auto 20px;font-size:34px;font-weight:900;border:1px solid #a7f3d0}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--good)}
h1{font-size:30px;line-height:1.15;margin:10px 0 10px;letter-spacing:-.035em}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
a.btn{display:flex;align-items:center;justify-content:center;margin-top:30px;border-radius:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:20px 26px;font-weight:800;font-size:17px;text-decoration:none;width:100%;min-height:66px;box-shadow:0 14px 34px rgba(79,70,229,.2)}
a.btn:hover{filter:brightness(.98)}
.small{margin-top:16px;font-size:10px;color:#98a2b3;line-height:1.5}
@media(max-width:560px){body{padding:18px}.box{padding:34px 24px 28px}}
</style>
<style id="veefivee-footer-visibility">.veefivee-footer{position:fixed!important;left:0!important;right:0!important;bottom:0!important;margin:0!important;padding:12px 20px 14px!important;z-index:99999!important;background:rgba(245,247,251,.97)!important;border-top:1px solid #e5e7ef!important;box-shadow:0 -6px 18px rgba(15,23,42,.05)!important;}</style></head>
<body>
<main class="box">
  <div class="brand"><div class="brand-mark">L</div><div class="brand-name">LogIn</div></div>
  <div class="icon" aria-hidden="true">✓</div>
  <div class="eyebrow">Setup complete</div>
  <h1>Your new DAT setup is installed</h1>
  <p>Your shared account is ready. Continue through one.dat.com.</p>
  <a class="btn" href="https://one.dat.com/" target="_blank" rel="noopener noreferrer">Continue to one.dat.com</a>
</main>
<footer class="veefivee-footer" style="box-sizing:border-box;width:100%;margin:40px auto 0;padding:16px 20px 18px;text-align:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:500;line-height:1.5;color:#6d4aff;letter-spacing:.1px;">Developed by 🌴<a href="https://veefivee.com" target="_blank" rel="noopener noreferrer" style="color:#6d4aff;text-decoration:none;font-weight:700;">VeeFivee</a></footer>
</body>
</html>
