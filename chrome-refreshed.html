<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Refreshed — LogIn</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f5f7fb;--text:#172033;--muted:#667085;--line:#e5e7ef}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);padding:38px 30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(15,23,42,.10)}
.mark{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:30px;font-weight:900;box-shadow:0 12px 28px rgba(79,70,229,.22)}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7b8190}
h1{margin:9px 0 8px;font-size:24px;line-height:1.15}
p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:24px;min-height:44px;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-decoration:none;font-size:12px;font-weight:850;box-shadow:0 10px 24px rgba(79,70,229,.20)}
</style>
</head>
<body>
<main class="card">
  <div class="mark">✓</div>
  <div class="eyebrow">LogIn</div>
  <h1>Your Chrome has been refreshed</h1>
  <p>Chrome cookies, site data, cache, browsing history and open tabs have been refreshed. You can now open your managed website again.</p>
  <a class="btn" href="https://one.dat.com" target="_self">Visit one.dat.com</a>
</main>
<script>
(() => {
  try {
    const params=new URLSearchParams(location.search);
    if (params.get('remote') !== '1') return;
    const eye=document.querySelector('.eyebrow');
    const h=document.querySelector('h1');
    const p=document.querySelector('p');
    if(eye)eye.textContent='LogIn';
    if(params.get('profile') === '1'){
      if(h)h.textContent='Your profile has been refreshed';
      if(p)p.textContent='Your browser data was cleaned and your latest shared login was automatically restored. You can now open one.dat.com again.';
    }else{
      if(h)h.textContent='Your Admin has cleaned your browser';
      if(p)p.textContent='Your Admin has cleared Chrome cookies, site data, cache, browsing history and open tabs. You can now open one.dat.com again.';
    }
  } catch {}
})();
</script>
</body>
</html>
