<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Sync • Reconnecting</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#5b45e8;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#f4f0ff,#f8fafc 58%,#f5f7fb);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:28px}.box{width:min(540px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 24px 70px rgba(15,23,42,.12);text-align:center}.icon{width:72px;height:72px;border-radius:22px;background:#eeeafe;color:var(--accent);display:grid;place-items:center;margin:0 auto 18px;font-size:30px;font-weight:900}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#667085}.title{font-size:29px;font-weight:900;margin:8px 0}.text{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.status{margin-top:18px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;font-size:13px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #d0d5dd;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}button{margin-top:18px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:11px 18px;font-weight:800;cursor:pointer}.hidden{display:none}.failed{border-color:#f0b4b0;background:#fff6f5;color:var(--danger)}
</style><style id="veefivee-footer-visibility">.veefivee-footer{position:fixed!important;left:0!important;right:0!important;bottom:0!important;margin:0!important;padding:12px 20px 14px!important;z-index:99999!important;background:rgba(245,247,251,.97)!important;border-top:1px solid #e5e7ef!important;box-shadow:0 -6px 18px rgba(15,23,42,.05)!important;}</style></head>
<body><main class="box"><div class="icon" id="icon">↻</div><div class="eyebrow">Cookie Sync Network</div><div class="title" id="title">Reconnecting…</div><p class="text" id="text">The proxy connection was interrupted. Cookie Sync is checking it again in the background.</p><div class="status" id="status"><span class="spinner"></span>Waiting for a confirmed proxy connection…</div><button id="retry" class="hidden">Try Again</button></main>
<script>
const q=new URLSearchParams(location.search);const target=q.get('target')||'';const $=id=>document.getElementById(id);let navigating=false;
function go(){if(!target||navigating)return;try{const u=new URL(target);if(!['http:','https:'].includes(u.protocol))throw new Error('bad target')}catch{return}$('status').textContent='Restoring the page…';navigating=true;location.href=target;}
async function check(){try{const r=await chrome.runtime.sendMessage({type:'proxy-wait-status'});if(r?.status==='connected'){go();return}if(r?.status==='failed'){ $('icon').textContent='!';$('title').textContent='Proxy unavailable';$('text').textContent='Cookie Sync retried the connection several times and could not restore the proxy.';$('status').className='status failed';$('status').textContent=r?.health?.reason||'Proxy could not be restored.';$('retry').classList.remove('hidden');return} $('status').innerHTML='<span class="spinner"></span>Cookie Sync is reconnecting in the background…';}catch(e){ $('status').textContent='Reconnecting…';}}
$('retry').onclick=async()=>{ $('retry').classList.add('hidden'); $('status').className='status'; $('status').innerHTML='<span class="spinner"></span>Trying again…';await chrome.runtime.sendMessage({type:'proxy-retry-now'}).catch(()=>{});check();};
check();setInterval(check,1000);
</script><footer class="veefivee-footer" style="box-sizing:border-box;width:100%;margin:40px auto 0;padding:16px 20px 18px;text-align:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:500;line-height:1.5;color:#6d4aff;letter-spacing:.1px;">Developed by 🌴<a href="https://veefivee.com" target="_blank" rel="noopener noreferrer" style="color:#6d4aff;text-decoration:none;font-weight:700;">VeeFivee</a></footer>
</body></html>
